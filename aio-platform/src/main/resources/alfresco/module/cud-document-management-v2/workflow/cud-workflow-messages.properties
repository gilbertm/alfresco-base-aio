# CUD Document Lifecycle Workflow Messages

# --- Process titles ---
cud-document-lifecycle.workflow.title=CUD Document Lifecycle
cud-document-lifecycle.workflow.description=Submit a draft document for review; on approval it is published (moved to the Published folder and locked), on rejection it returns to Draft.

cud-document-revision.workflow.title=CUD Document Revision
cud-document-revision.workflow.description=Copies a published document back into the Draft folder (as a "_rev" copy) so it can be revised and re-submitted.

# --- Start tasks ---
cudwf_submitForReviewStart.title=Submit for Review
cudwf_submitForReviewStart.description=Start the review of this document. It will be moved to the Review folder.
cudwf_submitForReviewStart.submitComment.label=Comment for Reviewer
cudwf_submitForReviewStart.submitComment.description=Optional message to the reviewer

cudwf_submitForRevisionStart.title=Submit for Revision
cudwf_submitForRevisionStart.description=Copies this published document to the Draft folder for revision. The published original remains locked.
cudwf_submitForRevisionStart.revisionComment.label=Revision Instructions
cudwf_submitForRevisionStart.revisionComment.description=What needs to be changed

# --- Tasks ---
cudwf_reviewTask.title=Review & Approve
cudwf_reviewTask.description=Approve to publish the document, or reject to send it back to Draft.
cudwf_reviewTask.approved.label=Approved
cudwf_reviewTask.approved.description=Approve = publish; Reject = back to Draft
cudwf_reviewTask.reviewComment.label=Review Comment
cudwf_reviewTask.reviewComment.description=Reason / feedback for the author